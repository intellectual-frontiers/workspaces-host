  <text x="196.0" y="328.70000000000005" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">text: first line is data.plain,</text>
  <text x="196.0" y="356.00000000000006" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">then what you can do next</text>
  <line x1="520.0" y1="190" x2="520.0" y2="279" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="370.0" y="280" width="300" height="110" rx="4" class="f-emphasis-tint s-emphasis" stroke-width="1.5"/>
  <text x="520.0" y="328.70000000000005" text-anchor="middle" class="f-emphasis" font-size="21" font-weight="normal">--json: the wire document,</text>
  <text x="520.0" y="356.00000000000006" text-anchor="middle" class="f-emphasis" font-size="21" font-weight="normal">schema ws-host/kind@N</text>
