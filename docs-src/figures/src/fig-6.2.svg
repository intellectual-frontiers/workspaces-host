  <rect x="320.0" y="120" width="400" height="70" rx="4" class="f-ink s-ink" stroke-width="1.5"/>
  <text x="520.0" y="162.7" text-anchor="middle" class="f-surface" font-size="22" font-weight="bold">Resource: kind, id, data, links, actions</text>
  <line x1="520.0" y1="190" x2="196.0" y2="279" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
