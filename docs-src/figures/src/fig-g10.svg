<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 532" width="1040" height="532">
  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="532" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="34" font-weight="bold">When something is wrong</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="20" font-weight="normal" font-style="italic">You do not have to work out what</text>
  <rect x="90.0" y="120" width="860" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="162.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">Look at the status bar or Home. Each row says what is wrong in plain words</text>
  <line x1="520.0" y1="190" x2="520.0" y2="223" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="224" width="860" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="266.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">Press Run on the row, or copy the line it shows</text>
  <line x1="520.0" y1="294" x2="520.0" y2="327" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="328" width="860" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="370.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">Still stuck? Run Get Help. It copies a report with no passwords in it</text>
  <line x1="520.0" y1="398" x2="520.0" y2="431" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="432" width="860" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="474.7" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">Paste the report to a person or an AI</text>
</svg>
