<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 428" width="1040" height="428">
  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="428" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="34" font-weight="bold">Copying is not trusting</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="20" font-weight="normal" font-style="italic">A repository can run code only after you say so</text>
  <rect x="90.0" y="120" width="860" height="70" rx="4" class="f-neutral-tint s-line" stroke-width="1.5"/>
  <text x="520.0" y="162.35" text-anchor="middle" class="f-body" font-size="21" font-weight="normal">ws-host copies the repository. Nothing in it can run yet</text>
  <line x1="520.0" y1="190" x2="520.0" y2="223" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="224" width="860" height="70" rx="4" class="f-emphasis-tint s-emphasis" stroke-width="1.5"/>
  <text x="520.0" y="266.7" text-anchor="middle" class="f-emphasis" font-size="22" font-weight="bold">You decide to trust it. A dialog asks, and only you can click it</text>
  <line x1="520.0" y1="294" x2="520.0" y2="327" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="328" width="860" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="370.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">Now ws-host can install the tools it lists. You can stop trusting it at any time</text>
</svg>
