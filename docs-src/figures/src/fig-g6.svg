<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 473" width="1040" height="473">
  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="473" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="34" font-weight="bold">What happens to your work when you sync?</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="20" font-weight="normal" font-style="italic">Nothing you wrote is ever overwritten</text>
  <rect x="240.0" y="130" width="560" height="93.2" rx="4" class="f-neutral-tint s-strong" stroke-width="1.5"/>
  <text x="520.0" y="169.99999999999997" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">Can the repository catch up without touching your</text>
  <text x="520.0" y="198.59999999999997" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">own changes?</text>
  <line x1="396.8" y1="223.2" x2="275.0" y2="322.2" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <line x1="643.2" y1="223.2" x2="765.0" y2="322.2" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="235.0" y="279.2" text-anchor="middle" class="f-muted" font-size="20" font-weight="bold">YES</text>
  <text x="805.0" y="279.2" text-anchor="middle" class="f-muted" font-size="20" font-weight="bold">NO</text>
  <rect x="60.0" y="323.2" width="430" height="110" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="275.0" y="385.55" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">It catches up to the shared copy.</text>
  <rect x="550.0" y="323.2" width="430" height="110" rx="4" class="f-emphasis-tint s-emphasis" stroke-width="1.5"/>
  <text x="765.0" y="371.90000000000003" text-anchor="middle" class="f-emphasis" font-size="21" font-weight="normal">It is left exactly as it was, and the result says</text>
  <text x="765.0" y="399.20000000000005" text-anchor="middle" class="f-emphasis" font-size="21" font-weight="normal">why. Your work is safe.</text>
</svg>
