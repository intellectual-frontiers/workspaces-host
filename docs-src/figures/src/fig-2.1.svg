<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 739" width="1040" height="739">
  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="739" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="34" font-weight="bold">From curl to a working machine</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="20" font-weight="normal" font-style="italic">install.sh, then the launcher, then Python</text>
  <rect x="90.0" y="120" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="159.0" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">install.sh checks git, curl, tar and xz, installs missing ones with apt, then clones the</text>
  <text x="520.0" y="186.3" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">repository</text>
  <line x1="520.0" y1="210.6" x2="520.0" y2="243.6" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="244.6" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="283.6" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">It links ~/.local/bin/ws-host to the launcher and runs it once with</text>
  <text x="520.0" y="310.90000000000003" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">WS_HOST_BOOTSTRAP_ONLY=1</text>
  <line x1="520.0" y1="335.2" x2="520.0" y2="368.2" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="369.2" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="421.85" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">The launcher fetches mise, and checks its SHA-256 against bootstrap.env before unpacking</text>
  <line x1="520.0" y1="459.79999999999995" x2="520.0" y2="492.79999999999995" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="493.79999999999995" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="546.4499999999999" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">mise installs the pinned Python and uv into its own store</text>
  <line x1="520.0" y1="584.4" x2="520.0" y2="617.4" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="618.4" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="671.4" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">python -m ws_host runs workspace ensure</text>
</svg>
