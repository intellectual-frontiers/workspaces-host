  <text x="520.0" y="266.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">toolchain generate writes mise config under .workspaces-host/mise/.config/mise/conf.d</text>
  <line x1="520.0" y1="294" x2="520.0" y2="327" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="328" width="860" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="370.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">mise lock writes mise.lock for linux-x64 and linux-arm64</text>
  <line x1="520.0" y1="398" x2="520.0" y2="431" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="432" width="860" height="70" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="474.7" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">toolchain ensure refuses stale or unlocked files, then runs mise install --locked</text>
