<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 713" width="1040" height="713">
  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="713" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="34" font-weight="bold">How archon tells a person from an agent</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="20" font-weight="normal" font-style="italic">It assumes nobody is there unless something says someone is</text>
  <rect x="90.0" y="120" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="159.0" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">1. ARCHON_ATTENDANCE says attended or unattended? That answer wins. The Workspaces</text>
  <text x="520.0" y="186.3" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">Console sets attended</text>
  <line x1="520.0" y1="210.6" x2="520.0" y2="243.6" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="244.6" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="297.25" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">2. CI or CLAUDE_CODE_REMOTE is true or 1? An agent or a CI job runs this. Unattended</text>
  <line x1="520.0" y1="335.2" x2="520.0" y2="368.2" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="369.2" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="421.85" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">3. Standard input and standard error are both a terminal? A person is typing. Attended</text>
  <line x1="520.0" y1="459.79999999999995" x2="520.0" y2="492.79999999999995" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="493.79999999999995" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="546.8" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">4. Anything else, including output sent through a pipe alone: unattended</text>
  <rect x="28" y="608.4" width="984" height="76.6" rx="3" class="f-neutral-tint s-line" stroke-width="1.2"/>
  <text x="520.0" y="654.4" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">Whether ws-host is installed plays no part in the decision</text>
</svg>
