<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 614" width="1040" height="614">
  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="614" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="34" font-weight="bold">Where a program comes from</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="20" font-weight="normal" font-style="italic">archon tries three sources in order and uses the first that has it</text>
  <rect x="90.0" y="120" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="159.0" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">1. Already on your computer: a program on PATH whose version meets the least the entry</text>
  <text x="520.0" y="186.3" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">accepts. Used as it is</text>
  <line x1="520.0" y1="210.6" x2="520.0" y2="243.6" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="244.6" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="283.6" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">2. Your package manager (apt, dnf, apk or brew) offers that version: installed without</text>
  <text x="520.0" y="310.90000000000003" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">questions, as root or with sudo</text>
  <line x1="520.0" y1="335.2" x2="520.0" y2="368.2" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="369.2" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="408.20000000000005" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">3. The download named by the entry, its SHA-256 checked before it is unpacked, kept once</text>
  <text x="520.0" y="435.50000000000006" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">in one store</text>
  <line x1="520.0" y1="459.79999999999995" x2="520.0" y2="492.79999999999995" class="s-line" stroke-width="2" marker-end="url(#arrD)"/>
  <rect x="90.0" y="493.79999999999995" width="860" height="90.6" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="546.8" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">None works: the command stops with exit status 3 and says why each source did not</text>
</svg>
