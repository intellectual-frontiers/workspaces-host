<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 623" width="1040" height="623">
  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="623" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="34" font-weight="bold">What ws-host writes, and what it leaves alone</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="20" font-weight="normal" font-style="italic">Three managed files, each by consent</text>
  <rect x="70.0" y="120" width="900" height="80" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="167.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">A marked prompt block in ~/.bashrc, after shell add bash</text>
  <rect x="70.0" y="218" width="900" height="80" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="265.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">A marked prompt block in fish config.fish, after shell add fish</text>
  <rect x="70.0" y="316" width="900" height="80" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="363.35" text-anchor="middle" class="f-ink" font-size="21" font-weight="normal">Missing keys in the VS Code settings file, never a key you set</text>
  <rect x="70.0" y="414" width="900" height="80" rx="4" class="f-emphasis-tint s-emphasis" stroke-width="1.5"/>
  <text x="520.0" y="461.35" text-anchor="middle" class="f-emphasis" font-size="21" font-weight="normal">Never read: any chezmoi config or source of your own, and any text outside the markers</text>
  <rect x="28" y="518" width="984" height="76.6" rx="3" class="f-neutral-tint s-line" stroke-width="1.2"/>
  <text x="520.0" y="564.0" text-anchor="middle" class="f-ink" font-size="22" font-weight="bold">Only text between the markers, or a key that was absent, is ever written</text>
</svg>
