  <defs><marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs>
  <rect width="1040" height="633" class="f-surface"/>
  <text x="28" y="50" text-anchor="start" class="f-ink" font-size="30.27" font-weight="bold">The system in five layers</text>
  <text x="28" y="84" text-anchor="start" class="f-muted" font-size="17.81" font-weight="normal" font-style="italic">Each layer talks only to the one below it</text>
  <rect x="70.0" y="120" width="900" height="80" rx="4" class="f-emphasis-tint s-emphasis" stroke-width="1.5"/>
  <text x="520.0" y="167.35" text-anchor="middle" class="f-emphasis" font-size="18.7" font-weight="normal">A person in VS Code, a terminal, or an AI agent</text>
  <rect x="70.0" y="218" width="900" height="80" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="265.35" text-anchor="middle" class="f-ink" font-size="18.7" font-weight="normal">The Workspaces Console: draws what the launcher says, runs nothing of its own</text>
  <rect x="70.0" y="316" width="900" height="80" rx="4" class="f-primary-tint s-primary" stroke-width="1.5"/>
  <text x="520.0" y="363.35" text-anchor="middle" class="f-ink" font-size="18.7" font-weight="normal">ws-host: a registry of commands, kits and help topics; every command returns one Resource</text>
  <rect x="70.0" y="414" width="900" height="80" rx="4" class="f-neutral-tint s-line" stroke-width="1.5"/>
  <text x="520.0" y="461.35" text-anchor="middle" class="f-body" font-size="18.7" font-weight="normal">lib/: git, repositories, trust, kits, mise, chezmoi, fetch. Plain Python with no command line in it</text>
  <rect x="70.0" y="512" width="900" height="90.6" rx="4" class="f-neutral-tint s-line" stroke-width="1.5"/>
  <text x="520.0" y="551.0" text-anchor="middle" class="f-body" font-size="18.7" font-weight="normal">The machine: apt, your home folder, ~/.local/share/workspaces-host, and the clones in</text>
  <text x="520.0" y="578.3" text-anchor="middle" class="f-body" font-size="18.7" font-weight="normal">~/workspaces</text>
</svg>
